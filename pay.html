<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Light Electricals - Quick Pay</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b131e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #111c2a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .brand { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
    .brand span { color: #f59e0b; }
    .amt-label { font-size: 13px; color: #94a3b8; margin-top: 14px; }
    .amt { font-size: 32px; font-weight: 900; color: #f59e0b; margin: 4px 0 18px 0; }
    .btn {
      display: block;
      background: #22c55e;
      color: #ffffff;
      font-weight: 900;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .upi-info { font-size: 12px; color: #64748b; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">MOON<span>LIGHT</span> ELECTRICALS</div>
    <div style="font-size: 11px; color:#f59e0b; font-style:italic;">Brightening Lives, Powering Trust</div>

    <div class="amt-label">Total Payable Amount:</div>
    <div class="amt" id="displayAmt">₹0.00</div>

    <a id="payBtn" href="#" class="btn">⚡ Pay via GPay / PhonePe / Paytm</a>

    <div class="upi-info">
      UPI ID: <b id="displayUpi" style="color:#cbd5e1;">-</b>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var pa = params.get('pa') || '8860880453@kotak';
    var am = params.get('am') || '0.00';
    var pn = 'Moon Light Electricals';

    document.getElementById('displayAmt').innerText = '₹' + parseFloat(am).toFixed(2);
    document.getElementById('displayUpi').innerText = pa;

    var upiUri = 'upi://pay?pa=' + encodeURIComponent(pa) + '&pn=' + encodeURIComponent(pn) + '&am=' + encodeURIComponent(am) + '&cu=INR';
    document.getElementById('payBtn').href = upiUri;

    // Auto-trigger UPI Apps on mobile
    window.onload = function() {
      setTimeout(function() {
        window.location.href = upiUri;
      }, 300);
    };
  </script>

</body>
</html>
