<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moon Light Electricals - Pay</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0b131e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: #111c2a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .brand { font-size: 20px; font-weight: 900; margin-bottom: 2px; }
    .brand span { color: #f59e0b; }
    .sub { font-size: 11px; color: #f59e0b; font-style: italic; margin-bottom: 16px; }

    .amt-box {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .amt-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
    .amt { font-size: 34px; font-weight: 900; color: #f59e0b; margin-top: 2px; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    
    .pay-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      color: #ffffff;
    }
    .btn-gpay { background: #1a73e8; }
    .btn-phonepe { background: #5f259f; }
    .btn-paytm { background: #00baf2; color: #070d14; font-weight: 900; }
    .btn-all { background: #059669; }

    .copy-box {
      background: #0b131e;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .upi-txt { font-family: monospace; font-size: 12.5px; color: #cbd5e1; font-weight: 700; }
    .btn-copy {
      background: #f59e0b;
      color: #0b131e;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">MOON<span>LIGHT</span> ELECTRICALS</div>
    <div class="sub">Brightening Lives, Powering Trust</div>

    <div class="amt-box">
      <div class="amt-label">Total Payable</div>
      <div class="amt" id="displayAmt">₹0.00</div>
    </div>

    <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 12px; font-weight: 700;">
      Select your UPI App to Pay:
    </div>

    <div class="btn-group">
      <a id="btnGPay" href="#" class="pay-btn btn-gpay">
        🔵 Pay with Google Pay
      </a>
      <a id="btnPhonePe" href="#" class="pay-btn btn-phonepe">
        🟣 Pay with PhonePe
      </a>
      <a id="btnPaytm" href="#" class="pay-btn btn-paytm">
        🔷 Pay with Paytm
      </a>
      <a id="btnAll" href="#" class="pay-btn btn-all">
        ⚡ Other UPI Apps (CRED / BHIM)
      </a>
    </div>

    <div style="font-size: 11px; color: #94a3b8; text-align: left; margin-top: 6px;">
      Or pay directly to UPI ID:
    </div>
    <div class="copy-box">
      <span class="upi-txt" id="displayUpi">-</span>
      <button class="btn-copy" onclick="copyUpi()">📋 Copy</button>
    </div>
    <div id="copiedToast" style="color:#22c55e; font-size:11px; font-weight:bold; margin-top:4px; display:none;">
      ✓ UPI ID copied!
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var pa = params.get('pa') || '8860880453@kotak';
    var am = params.get('am') || '0.00';
    var pn = 'Moon Light Electricals';

    document.getElementById('displayAmt').innerText = '₹' + parseFloat(am).toFixed(2);
    document.getElementById('displayUpi').innerText = pa;

    var cleanAm = parseFloat(am).toFixed(2);
    var baseQuery = 'pa=' + encodeURIComponent(pa) + '&pn=' + encodeURIComponent(pn) + '&am=' + cleanAm + '&cu=INR';

    document.getElementById('btnGPay').href = 'gpay://upi/pay?' + baseQuery;
    document.getElementById('btnPaytm').href = 'paytmmp://pay?' + baseQuery;
    document.getElementById('btnAll').href = 'upi://pay?' + baseQuery;
    document.getElementById('btnPhonePe').href = 'upi://pay?' + baseQuery;

    function copyUpi() {
      var upi = document.getElementById('displayUpi').innerText;
      navigator.clipboard.writeText(upi);
      var toast = document.getElementById('copiedToast');
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, 2000);
    }
  </script>

</body>
</html>
