<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moon Light Electricals - Pay</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0b131e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: #111c2a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 24px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .brand { font-size: 20px; font-weight: 900; margin-bottom: 2px; }
    .brand span { color: #f59e0b; }
    .sub { font-size: 11px; color: #f59e0b; font-style: italic; margin-bottom: 16px; }
    
    .amt-box {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .amt-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
    .amt { font-size: 32px; font-weight: 900; color: #f59e0b; margin-top: 2px; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    
    .pay-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 800;
      text-decoration: none;
      color: #ffffff;
      transition: 0.2s;
    }
    .btn-gpay { background: #1a73e8; }
    .btn-phonepe { background: #5f259f; }
    .btn-paytm { background: #00baf2; color: #070d14; font-weight: 900; }
    .btn-default { background: #059669; }

    .upi-details {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.5;
    }
    .upi-badge {
      display: inline-block;
      background: #1e293b;
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">MOON<span>LIGHT</span> ELECTRICALS</div>
    <div class="sub">Brightening Lives, Powering Trust</div>

    <div class="amt-box">
      <div class="amt-label">Payable Amount</div>
      <div class="amt" id="displayAmt">₹0.00</div>
    </div>

    <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 10px; font-weight: 700;">
      Choose your payment app:
    </div>

    <div class="btn-group">
      <a id="btnPhonePe" href="#" class="pay-btn btn-phonepe">
        🟣 Pay with PhonePe
      </a>
      <a id="btnGPay" href="#" class="pay-btn btn-gpay">
        🔵 Pay with Google Pay
      </a>
      <a id="btnPaytm" href="#" class="pay-btn btn-paytm">
        🔷 Pay with Paytm
      </a>
      <a id="btnGeneric" href="#" class="pay-btn btn-default">
        ⚡ Other UPI Apps
      </a>
    </div>

    <div class="upi-details">
      Verified Shop UPI ID:<br>
      <span class="upi-badge" id="displayUpi">-</span>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var pa = params.get('pa') || '8860880453@kotak';
    var am = params.get('am') || '0.00';
    var pn = 'Moon Light Electricals';

    document.getElementById('displayAmt').innerText = '₹' + parseFloat(am).toFixed(2);
    document.getElementById('displayUpi').innerText = pa;

    var commonQuery = 'pa=' + encodeURIComponent(pa) + '&pn=' + encodeURIComponent(pn) + '&am=' + encodeURIComponent(am) + '&cu=INR';

    // Direct Intent links for iOS & Android
    document.getElementById('btnPhonePe').href = 'phonepe://pay?' + commonQuery;
    document.getElementById('btnGPay').href = 'gpay://upi/pay?' + commonQuery;
    document.getElementById('btnPaytm').href = 'paytmmp://pay?' + commonQuery;
    document.getElementById('btnGeneric').href = 'upi://pay?' + commonQuery;
  </script>

</body>
</html>
