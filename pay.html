<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moon Light Electricals - Payment</title>
  <!-- 100% Reliable QR Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0b131e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: #111c2a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .brand { font-size: 20px; font-weight: 900; margin-bottom: 2px; }
    .brand span { color: #f59e0b; }
    .sub { font-size: 11px; color: #f59e0b; font-style: italic; margin-bottom: 16px; }

    .amt-box {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
    }
    .amt-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
    .amt { font-size: 34px; font-weight: 900; color: #f59e0b; margin-top: 2px; }

    .qr-container {
      background: #ffffff;
      padding: 14px;
      border-radius: 14px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      min-width: 208px;
      min-height: 208px;
    }
    .qr-container img {
      display: block;
      margin: auto;
    }

    .scan-note {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.4;
    }

    .copy-box {
      background: #0b131e;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .upi-txt { font-family: monospace; font-size: 13px; color: #38bdf8; font-weight: 700; }
    .btn-copy {
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-copy:active {
      transform: scale(0.96);
    }
    .copied-toast {
      color: #22c55e;
      font-size: 11.5px;
      font-weight: bold;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">MOON<span>LIGHT</span> ELECTRICALS</div>
    <div class="sub">Brightening Lives, Powering Trust</div>

    <div class="amt-box">
      <div class="amt-label">Total Payable</div>
      <div class="amt" id="displayAmt">₹0.00</div>
    </div>

    <!-- Clear Screen QR Code -->
    <div class="qr-container" id="qrContainer"></div>

    <div class="scan-note">
      📸 Scan with PhonePe / GPay / Paytm<br>
      <span style="font-size: 10.5px; color: #94a3b8;">(Or take screenshot and scan in app)</span>
    </div>

    <!-- 1-Click Copy UPI Section -->
    <div style="font-size: 11px; color: #94a3b8; text-align: left; margin-top: 10px;">
      Or Pay to UPI ID:
    </div>
    <div class="copy-box">
      <span class="upi-txt" id="displayUpi">-</span>
      <button class="btn-copy" onclick="copyUpi()">📋 Copy</button>
    </div>
    <div id="copiedToast" class="copied-toast">✓ UPI ID copied!</div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var pa = params.get('pa') || '8860880453@kotak';
    var am = params.get('am') || '0.00';
    var pn = 'Moon Light Electricals';

    document.getElementById('displayAmt').innerText = '₹' + parseFloat(am).toFixed(2);
    document.getElementById('displayUpi').innerText = pa;

    // Standard Clean NPCI String
    var upiUri = 'upi://pay?pa=' + encodeURIComponent(pa) + 
                 '&pn=' + encodeURIComponent(pn) + 
                 '&am=' + parseFloat(am).toFixed(2) + 
                 '&cu=INR';

    // Instant Client-Side QR Generation
    new QRCode(document.getElementById("qrContainer"), {
      text: upiUri,
      width: 180,
      height: 180,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    function copyUpi() {
      var upi = document.getElementById('displayUpi').innerText;
      navigator.clipboard.writeText(upi);
      var toast = document.getElementById('copiedToast');
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, 2500);
    }
  </script>

</body>
</html>
