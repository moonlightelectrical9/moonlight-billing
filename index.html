<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moon Light Electricals - ERP & Billing</title>
  <style>
    :root {
      --bg: #0b131e;
      --card: #111c2a;
      --border: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; min-height: 100vh; }
    
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { font-size: 17px; font-weight: 900; }
    .brand span { color: var(--accent); }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-sync {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-sync:active { transform: scale(0.95); background: #334155; }
    .user-pill { font-size: 11px; background: #1e293b; padding: 5px 9px; border-radius: 20px; color: var(--subtext); border: 1px solid var(--border); }
    
    .container { max-width: 900px; margin: 16px auto; padding: 0 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .card-title { font-size: 14.5px; font-weight: 800; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; font-weight: 700; color: var(--subtext); }
    .req { color: var(--danger); }
    input, select, textarea { background: #0b131e; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 13.5px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: #0b131e; color: #ffffff; }

    .btn { background: var(--accent); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-green { background: var(--success); color: #fff; }
    .btn-red { background: var(--danger); color: #fff; }

    .item-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
    .item-table th { background: #1e293b; padding: 10px 8px; text-align: left; color: var(--subtext); }
    .item-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); }

    .totals-box { margin-top: 16px; padding: 14px; background: #0b131e; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .grand-total { font-size: 22px; font-weight: 900; color: var(--accent); }

    /* Login Screen Modal */
    #loginModal { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; width: 100%; max-width: 380px; text-align: center; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav-btn { flex: 1; padding: 9px; background: #1e293b; color: var(--subtext); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
    .nav-btn.active { background: var(--accent); color: #000; }
  </style>
</head>
<body>

  <!-- 🔒 LOGIN OVERLAY -->
  <div id="loginModal" style="display: none;">
    <div class="login-box">
      <div class="brand" style="font-size: 20px; margin-bottom: 4px;">MOON<span>LIGHT</span> ELECTRICALS</div>
      <div style="font-size: 11px; color: var(--accent); font-style: italic; margin-bottom: 18px;">Brightening Lives, Powering Trust</div>
      
      <div id="stepPhone">
        <label style="display:block; text-align:left; margin-bottom:6px;">AUTHORIZED MOBILE NUMBER</label>
        <input type="tel" id="loginPhone" placeholder="Enter 10-digit number" style="width: 100%; margin-bottom: 12px; font-size: 16px;">
        <div id="loginErr" style="color: var(--danger); font-size: 12px; margin-bottom: 10px; display: none;"></div>
        <button class="btn" id="sendOtpBtn" onclick="sendOtp()" style="width: 100%;">📲 SEND OTP ON WHATSAPP</button>
      </div>

      <div id="stepOtp" style="display: none;">
        <div style="font-size: 12px; color: var(--subtext); margin-bottom: 10px;">
          OTP sent for: <b id="displaySentPhone" style="color: #fff;"></b>
        </div>
        <input type="number" id="loginOtpInput" placeholder="Enter 4-digit OTP" style="width: 100%; margin-bottom: 12px; font-size: 18px; text-align:center;">
        <button class="btn btn-green" onclick="verifyOtp()" style="width: 100%; margin-bottom: 8px;">VERIFY & LOGIN</button>
        <div style="margin-top: 10px;">
          <a id="waDirectBtn" href="#" target="_blank" style="font-size: 11px; color: var(--accent); text-decoration: underline;">Open WhatsApp chat for OTP</a>
        </div>
      </div>
    </div>
  </div>

  <!-- 🏠 TOP NAVBAR WITH REFRESH BUTTON -->
  <div class="header">
    <div class="brand">MOON<span>LIGHT</span> ELECTRICALS</div>
    <div class="header-actions">
      <button class="btn-sync" id="btnSync" onclick="manualSyncItems()" title="Refresh Sheet Inventory">
        🔄 Refresh
      </button>
      <div id="userDisplay" class="user-pill">Session...</div>
    </div>
  </div>

  <div class="container">
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('billing')">🧾 Create Bill</button>
      <button class="nav-btn" id="khataTabBtn" onclick="switchTab('khata')">📒 Udhar Khata</button>
      <button class="nav-btn" id="stockTabBtn" onclick="switchTab('stock')">📦 Inventory</button>
    </div>

    <!-- 🧾 BILLING VIEW -->
    <div id="viewBilling">
      <div class="card">
        <div class="card-title">1. Customer & Bill Information</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Customer Name <span class="req">*</span></label>
            <input type="text" id="custName" placeholder="e.g. Ramesh Kumar">
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="custPhone" placeholder="10-digit number">
          </div>
          <div class="form-group">
            <label>Rate Type <span class="req">*</span></label>
            <select id="rateType" onchange="onRateTypeChange()">
              <option value="" disabled selected>-- Select Rate Type --</option>
              <option value="Customer">Normal Customer</option>
              <option value="Electrician">Electrician Rate</option>
              <option value="Wholesale">Wholesale / Special</option>
            </select>
          </div>
          <div class="form-group">
            <label>Payment Mode <span class="req">*</span></label>
            <select id="payMode">
              <option value="" disabled selected>-- Select Payment Mode --</option>
              <option value="Cash">Cash</option>
              <option value="UPI / Online">UPI / Online</option>
              <option value="Credit / Udhar">Credit / Udhar</option>
            </select>
          </div>
          <div class="form-group">
            <label>Document Type</label>
            <select id="billMode">
              <option value="Invoice">Retail Invoice</option>
              <option value="Estimate">Quotation / Estimate</option>
            </select>
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" id="custAddr" value="Sector-121, Noida">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">2. Add Items</div>
        <div class="form-grid">
          <div class="form-group" style="grid-column: span 2;">
            <label>Select Item / Service</label>
            <input list="itemsList" id="itemSearch" placeholder="Type item name..." onchange="onItemSelect()">
            <datalist id="itemsList"></datalist>
          </div>
          <div class="form-group">
            <label>Rate (₹)</label>
            <input type="number" id="itemRate" value="0">
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="itemQty" value="1" min="1">
          </div>
          <div class="form-group">
            <label>Serial / Note</label>
            <input type="text" id="itemSerial" placeholder="Optional">
          </div>
        </div>
        <button class="btn btn-blue" onclick="addItemToTable()" style="margin-top: 14px; width: 100%;">+ Add Item To Bill</button>

        <table class="item-table" id="billTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Item</th>
              <th>Rate</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="billBody"></tbody>
        </table>

        <div class="totals-box">
          <div>
            <div style="font-size: 11px; color: var(--subtext); text-transform: uppercase;">Total Items</div>
            <div id="totalItemsCount" style="font-weight: 800; font-size: 16px;">0</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 11px; color: var(--subtext); text-transform: uppercase;">Grand Total</div>
            <div class="grand-total" id="grandTotalDisplay">₹0.00</div>
          </div>
        </div>

        <button class="btn btn-green" id="btnSubmitBill" onclick="validateAndSaveBill()" style="margin-top: 16px; width: 100%; padding: 14px; font-size: 16px;">
          ⚡ GENERATE & PRINT INVOICE
        </button>
      </div>
    </div>

    <!-- 📒 UDHAR VIEW -->
    <div id="viewKhata" style="display: none;">
      <div class="card">
        <div class="card-title">Pending Udhar Records</div>
        <div id="khataList" style="font-size: 13px;">Loading...</div>
      </div>
    </div>

    <!-- 📦 STOCK VIEW -->
    <div id="viewStock" style="display: none;">
      <div class="card">
        <div class="card-title">Inventory Stock Update</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="newStockName">
          </div>
          <div class="form-group">
            <label>Add Qty</label>
            <input type="number" id="newStockQty" value="10">
          </div>
        </div>
        <button class="btn btn-blue" onclick="saveStock()" style="margin-top: 12px;">Update Stock</button>
      </div>
    </div>
  </div>

  <script>
    // ⚙️ APPS SCRIPT URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby53dD-xMhDqT-8k8N7iB9E6fM3WkP_nJ1qA/exec";

    let currentUser = JSON.parse(localStorage.getItem("mle_user")) || null;
    let cachedItems = JSON.parse(localStorage.getItem("mle_items")) || [];
    let billItems = [];

    window.onload = function() {
      if (!currentUser) {
        document.getElementById("loginModal").style.display = "flex";
      } else {
        initApp();
      }
    };

    function initApp() {
      document.getElementById("userDisplay").innerText = currentUser.name + " (" + currentUser.role + ")";
      if (currentUser.role !== "Admin") {
        document.getElementById("khataTabBtn").style.display = "none";
        document.getElementById("stockTabBtn").style.display = "none";
      }
      populateItemsDropdown(cachedItems);
      fetchAppData();
    }

    async function apiCall(action, data = {}) {
      data.action = action;
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });
      return await res.json();
    }

    // ⚡ MANUAL SYNC / FRESH REFRESH BUTTON
    async function manualSyncItems() {
      const syncBtn = document.getElementById("btnSync");
      syncBtn.innerText = "⏳ Syncing...";
      syncBtn.disabled = true;

      try {
        const res = await apiCall("getAppData", { role: (currentUser ? currentUser.role : "Staff") });
        if (res && res.items) {
          cachedItems = res.items;
          localStorage.setItem("mle_items", JSON.stringify(res.items));
          populateItemsDropdown(res.items);
          syncBtn.innerText = "✓ Updated!";
        } else {
          syncBtn.innerText = "🔄 Refresh";
        }
      } catch(e) {
        syncBtn.innerText = "⚠️️ Failed";
      }

      setTimeout(() => {
        syncBtn.innerText = "🔄 Refresh";
        syncBtn.disabled = false;
      }, 1800);
    }

    // ⚡ LOGIN FLOW
    async function sendOtp() {
      const phone = document.getElementById("loginPhone").value.trim().replace(/\D/g, '');
      const err = document.getElementById("loginErr");
      const btn = document.getElementById("sendOtpBtn");
      if (phone.length !== 10) {
        err.innerText = "10-digit mobile number bharein!";
        err.style.display = "block";
        return;
      }
      err.style.display = "none";
      btn.disabled = true;
      btn.innerText = "Generating OTP...";
      try {
        const res = await apiCall("requestLoginOtp", { phone: phone });
        btn.disabled = false;
        btn.innerText = "📲 SEND OTP ON WHATSAPP";
        if (res && res.success) {
          document.getElementById("stepPhone").style.display = "none";
          document.getElementById("stepOtp").style.display = "block";
          document.getElementById("displaySentPhone").innerText = res.phone + " (" + res.name + ")";
          document.getElementById("waDirectBtn").href = res.waUrl;
          window.open(res.waUrl, '_blank');
        } else {
          err.innerText = res.message || "Unauthorized Mobile Number!";
          err.style.display = "block";
        }
      } catch(e) {
        btn.disabled = false;
        btn.innerText = "📲 SEND OTP ON WHATSAPP";
        err.innerText = "Connection failed. Please retry!";
        err.style.display = "block";
      }
    }

    async function verifyOtp() {
      const phone = document.getElementById("loginPhone").value.trim().replace(/\D/g, '');
      const otp = document.getElementById("loginOtpInput").value.trim();
      const res = await apiCall("verifyLoginOtp", { phone: phone, otp: otp });
      if (res && res.success) {
        currentUser = res;
        localStorage.setItem("mle_user", JSON.stringify(res));
        document.getElementById("loginModal").style.display = "none";
        initApp();
      } else {
        alert(res.message || "Galat OTP!");
      }
    }

    async function fetchAppData() {
      try {
        const res = await apiCall("getAppData", { role: currentUser.role });
        if (res && res.items) {
          cachedItems = res.items;
          localStorage.setItem("mle_items", JSON.stringify(res.items));
          populateItemsDropdown(res.items);
        }
      } catch(e) {}
    }

    function populateItemsDropdown(items) {
      const list = document.getElementById("itemsList");
      list.innerHTML = "";
      items.forEach(it => {
        const opt = document.createElement("option");
        opt.value = it.name;
        list.appendChild(opt);
      });
    }

    function onItemSelect() {
      const name = document.getElementById("itemSearch").value.trim();
      const rateType = document.getElementById("rateType").value || "Customer";
      const item = cachedItems.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (item) {
        let r = item.custRate;
        if (rateType === "Electrician") r = item.elecRate;
        if (rateType === "Wholesale" && item.famRate) r = item.famRate;
        document.getElementById("itemRate").value = r;
      }
    }

    function onRateTypeChange() {
      onItemSelect();
    }

    function addItemToTable() {
      const name = document.getElementById("itemSearch").value.trim();
      const rate = parseFloat(document.getElementById("itemRate").value) || 0;
      const qty = parseInt(document.getElementById("itemQty").value) || 1;
      const serial = document.getElementById("itemSerial").value.trim();

      if (!name) { alert("⚠️ Kripya item select karein!"); return; }
      if (rate <= 0) { alert("⚠️ Rate zero se zyada hona chahiye!"); return; }

      const total = rate * qty;
      billItems.push({ name, rate, baseRate: rate, finalRate: rate, qty, discount: 0, serialNo: serial, total });
      renderBillTable();

      document.getElementById("itemSearch").value = "";
      document.getElementById("itemRate").value = "0";
      document.getElementById("itemQty").value = "1";
      document.getElementById("itemSerial").value = "";
    }

    function renderBillTable() {
      const tbody = document.getElementById("billBody");
      tbody.innerHTML = "";
      let grand = 0;
      billItems.forEach((it, idx) => {
        grand += it.total;
        tbody.innerHTML += `
          <tr>
            <td>${idx + 1}</td>
            <td><b>${it.name}</b> ${it.serialNo ? `<br><small style="color:var(--accent)">SN: ${it.serialNo}</small>` : ''}</td>
            <td>₹${it.rate.toFixed(2)}</td>
            <td>${it.qty}</td>
            <td>₹${it.total.toFixed(2)}</td>
            <td><button class="btn btn-red" style="padding:4px 8px; font-size:11px;" onclick="removeItem(${idx})">X</button></td>
          </tr>
        `;
      });
      document.getElementById("totalItemsCount").innerText = billItems.length;
      document.getElementById("grandTotalDisplay").innerText = "₹" + grand.toFixed(2);
    }

    function removeItem(idx) {
      billItems.splice(idx, 1);
      renderBillTable();
    }

    async function validateAndSaveBill() {
      const custName = document.getElementById("custName").value.trim();
      const rateType = document.getElementById("rateType").value;
      const payMode = document.getElementById("payMode").value;

      if (!custName) {
        alert("⚠️ Galti: Kripya Customer ka Naam enter karein!");
        document.getElementById("custName").focus();
        return;
      }
      if (!rateType) {
        alert("⚠️ Galti: Kripya Rate Type select karein!");
        document.getElementById("rateType").focus();
        return;
      }
      if (!payMode) {
        alert("⚠️ Galti: Kripya Payment Mode (Cash / UPI / Udhar) select karein!");
        document.getElementById("payMode").focus();
        return;
      }
      if (billItems.length === 0) {
        alert("⚠️ Galti: Bill me kam se kam 1 item zaroor add karein!");
        return;
      }

      const btn = document.getElementById("btnSubmitBill");
      btn.disabled = true;
      btn.innerText = "⏳ Saving Bill & Generating PDF...";

      const payload = {
        customerName: custName,
        phone: document.getElementById("custPhone").value.trim(),
        address: document.getElementById("custAddr").value.trim(),
        paymentMode: payMode,
        billMode: document.getElementById("billMode").value,
        items: billItems,
        grandTotal: billItems.reduce((acc, curr) => acc + curr.total, 0)
      };

      try {
        const res = await apiCall("processBillOrEstimate", payload);
        btn.disabled = false;
        btn.innerText = "⚡ GENERATE & PRINT INVOICE";

        if (res && res.success) {
          alert("✓ Bill Generated Successfully! Doc No: " + res.docNo);
          if (res.pdfUrl) window.open(res.pdfUrl, '_blank');
          
          billItems = [];
          renderBillTable();
          document.getElementById("custName").value = "";
          document.getElementById("custPhone").value = "";
          document.getElementById("rateType").selectedIndex = 0;
          document.getElementById("payMode").selectedIndex = 0;
        } else {
          alert("Error: " + (res.message || "Failed to save bill"));
        }
      } catch(e) {
        btn.disabled = false;
        btn.innerText = "⚡ GENERATE & PRINT INVOICE";
        alert("Server error. Please retry!");
      }
    }

    function switchTab(tab) {
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("viewBilling").style.display = (tab === 'billing') ? 'block' : 'none';
      document.getElementById("viewKhata").style.display = (tab === 'khata') ? 'block' : 'none';
      document.getElementById("viewStock").style.display = (tab === 'stock') ? 'block' : 'none';
      
      if (tab === 'khata') loadKhata();
    }

    async function loadKhata() {
      const el = document.getElementById("khataList");
      el.innerHTML = "Fetching pending records...";
      const res = await apiCall("getKhataRecords", { role: currentUser.role });
      if (res && res.records) {
        if (res.records.length === 0) { el.innerHTML = "No pending records!"; return; }
        let html = '<table class="item-table"><thead><tr><th>Doc No</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody>';
        res.records.forEach(r => {
          html += `<tr><td>${r.docNo}</td><td>${r.date}</td><td>${r.customerName}</td><td>₹${r.amount}</td><td><b style="color:${r.status==='Paid'?'#10b981':'#f59e0b'}">${r.status}</b></td></tr>`;
        });
        html += '</tbody></table>';
        el.innerHTML = html;
      }
    }
  </script>
</body>
</html>
