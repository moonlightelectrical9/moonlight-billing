<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moon Light Electricals</title>
  <style>
    :root {
      --bg: #070d17;
      --border: #1e293b;
      --input-bg: #eef2f9;
      --input-text: #0f172a;
      --accent: #f59e0b;
      --green: #059669;
      --danger-bg: #fee2e2;
      --danger-border: #fca5a5;
      --danger-text: #b91c1c;
      --yellow-bar: #fef3c7;
      --yellow-border: #fde68a;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: #ffffff; padding: 12px; min-height: 100vh; }

    /* Top Nav */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px 14px 10px;
    }
    .brand-title { font-size: 16px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; }
    .brand-title span { color: var(--accent); }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .btn-refresh {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-refresh:active { transform: scale(0.96); background: #334155; }
    .user-pill {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* Container */
    .container { max-width: 1300px; margin: 0 auto; }

    /* Low stock alert banner */
    .alert-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 12px 16px;
      color: var(--danger-text);
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 16px;
      display: none;
    }
    .alert-box b { font-weight: 900; }

    /* Grid layout */
    .grid-row {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }
    .row-5 { grid-template-columns: repeat(5, 1fr); }
    .row-2 { grid-template-columns: 2fr 1fr; }
    .row-item-top { grid-template-columns: 3fr 2fr 1fr; }
    .row-item-btm { grid-template-columns: 2fr 1.5fr 1.5fr 1fr 2fr; }

    @media (max-width: 860px) {
      .row-5 { grid-template-columns: repeat(2, 1fr); }
      .row-2 { grid-template-columns: 1fr; }
      .row-item-top { grid-template-columns: 1fr; }
      .row-item-btm { grid-template-columns: 1fr 1fr; }
    }

    .form-col { display: flex; flex-direction: column; gap: 5px; }
    .form-col label {
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Light Theme inputs matching original screenshot */
    input, select {
      background: var(--input-bg);
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 9px 11px;
      font-size: 13.5px;
      color: var(--input-text);
      outline: none;
      font-weight: 600;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      background: #ffffff;
    }
    input::placeholder { color: #64748b; font-weight: normal; }
    input:disabled, input[readonly] { background: #e2e8f0; color: #475569; }

    .separator {
      border-bottom: 1px dashed #334155;
      margin: 16px 0;
    }

    /* Green add button */
    .btn-add {
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      margin-top: 6px;
      margin-bottom: 16px;
    }
    .btn-add:hover { background: #047857; }

    /* Table */
    .table-wrap {
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      color: #0f172a;
      font-size: 13px;
    }
    th {
      background: #f8fafc;
      padding: 10px 12px;
      text-align: left;
      font-weight: 800;
      border-bottom: 2px solid #e2e8f0;
      font-size: 12px;
      color: #334155;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 600;
    }
    .btn-del-row {
      color: #dc2626;
      font-weight: 900;
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    /* Grand Total Bar */
    .total-bar {
      background: var(--yellow-bar);
      border: 1px solid var(--yellow-border);
      border-radius: 6px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #000000;
      margin-bottom: 16px;
    }
    .total-title { font-size: 15px; font-weight: 900; }
    .total-amt { font-size: 19px; font-weight: 900; }

    /* Save bill button */
    .btn-save {
      background: #c25e00;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 900;
      width: 100%;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn-save:hover { background: #9a4c03; }
    .btn-save:disabled { background: #64748b; cursor: not-allowed; }

    /* Login Modal */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .auth-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 🔒 LOGIN OVERLAY -->
  <div id="authOverlay" style="display: none;">
    <div class="auth-box">
      <div class="brand-title" style="font-size: 20px;">MOON<span>LIGHT</span> ELECTRICALS</div>
      <div style="font-size: 11px; color: var(--accent); font-style: italic; margin-top: 3px; margin-bottom: 20px;">Brightening Lives, Powering Trust</div>

      <div id="stepPhone">
        <label style="display:block; text-align:left; font-size:11px; font-weight:800; color:#cbd5e1; margin-bottom:6px;">AUTHORIZED MOBILE NUMBER</label>
        <input type="tel" id="loginPhone" placeholder="Enter 10-digit number" style="width: 100%; margin-bottom: 12px; font-size: 16px;">
        <div id="loginErr" style="color: #ef4444; font-size: 12px; margin-bottom: 10px; display: none;"></div>
        <button class="btn-save" id="btnSendOtp" onclick="sendOtp()" style="background:#f59e0b; color:#000;">📲 SEND OTP ON WHATSAPP</button>
      </div>

      <div id="stepOtp" style="display: none;">
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">OTP sent for: <b id="displaySentPhone" style="color:#fff;"></b></div>
        <input type="number" id="loginOtp" placeholder="Enter 4-digit OTP" style="width: 100%; margin-bottom: 12px; font-size: 20px; text-align: center; letter-spacing: 4px;">
        <button class="btn-save" onclick="verifyOtp()" style="background:#10b981;">VERIFY & LOGIN</button>
        <div style="margin-top: 12px;">
          <a id="waDirectBtn" href="#" target="_blank" style="font-size: 11px; color: var(--accent); text-decoration: underline;">Direct open WhatsApp for OTP</a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Top Nav with Phone Refresh -->
    <div class="top-nav">
      <div class="brand-title">MOON<span>LIGHT</span> ELECTRICALS</div>
      <div class="nav-actions">
        <button class="btn-refresh" id="btnRefresh" onclick="refreshAppData()" title="Sync Items & Low Stock Alerts">
          🔄 Refresh
        </button>
        <div class="user-pill" id="lblUser">Session...</div>
      </div>
    </div>

    <!-- Low Stock Alert Box -->
    <div class="alert-box" id="lowStockAlertBox">
      <b>⚠️ LOW STOCK ALERT:</b>
      <div id="lowStockItemsList" style="margin-top: 4px;"></div>
    </div>

    <!-- ROW 1: 5 Columns (Date, Mode, Rate Type, GST Bill?, Payment) -->
    <div class="grid-row row-5">
      <div class="form-col">
        <label>BILL DATE</label>
        <input type="date" id="billDate">
      </div>
      <div class="form-col">
        <label>MODE <span style="color:#ef4444;">*</span></label>
        <select id="billMode">
          <option value="" disabled selected>-- Select Mode --</option>
          <option value="Final Bill (Tax_Invoices)">Final Bill (Tax_Invoices)</option>
          <option value="Estimate (Estimates)">Estimate (Estimates)</option>
        </select>
      </div>
      <div class="form-col">
        <label>RATE TYPE <span style="color:#ef4444;">*</span></label>
        <select id="rateType" onchange="onRateTypeChange()">
          <option value="" disabled selected>-- Select Rate Type --</option>
          <option value="Customer Rate">Customer Rate</option>
          <option value="Electrician Rate">Electrician Rate</option>
          <option value="Wholesale Rate">Wholesale Rate</option>
        </select>
      </div>
      <div class="form-col">
        <label>GST BILL? <span style="color:#ef4444;">*</span></label>
        <select id="isGstBill" onchange="calculateItemTotal()">
          <option value="" disabled selected>-- Select GST Bill --</option>
          <option value="Yes (GST Invoice)">Yes (GST Invoice)</option>
          <option value="No (Regular Bill)">No (Regular Bill)</option>
        </select>
      </div>
      <div class="form-col">
        <label>PAYMENT <span style="color:#ef4444;">*</span></label>
        <select id="paymentMode">
          <option value="" disabled selected>-- Select Payment --</option>
          <option value="Cash">Cash</option>
          <option value="UPI / Online">UPI / Online</option>
          <option value="Credit / Udhar">Credit / Udhar</option>
        </select>
      </div>
    </div>

    <!-- ROW 2: Customer Name, WhatsApp Number -->
    <div class="grid-row row-2">
      <div class="form-col">
        <label>CUSTOMER NAME <span style="color:#ef4444;">*</span></label>
        <input type="text" id="custName" placeholder="Customer Name">
      </div>
      <div class="form-col">
        <label>WHATSAPP NUMBER</label>
        <input type="tel" id="custPhone" placeholder="10-digit number">
      </div>
    </div>

    <!-- ROW 3: Customer Address, Customer GSTIN -->
    <div class="grid-row row-2">
      <div class="form-col">
        <label>CUSTOMER ADDRESS</label>
        <input type="text" id="custAddress" value="Sector-121, Noida">
      </div>
      <div class="form-col">
        <label>CUSTOMER GSTIN (OPTIONAL)</label>
        <input type="text" id="custGstin" placeholder="09XXXXX...">
      </div>
    </div>

    <div class="separator"></div>

    <!-- ROW 4: Item Name, Work Note, HSN -->
    <div class="grid-row row-item-top">
      <div class="form-col">
        <label>ITEM / SERVICE NAME</label>
        <input list="dlItems" id="itemSearch" placeholder="Search item or type Labour Charge..." onchange="onItemSelect()">
        <datalist id="dlItems"></datalist>
      </div>
      <div class="form-col">
        <label>WORK NOTE / SERIAL / WARRANTY</label>
        <input type="text" id="itemSerial" placeholder="e.g. Fan Fitting / SN1092">
      </div>
      <div class="form-col">
        <label>HSN / SAC</label>
        <input type="text" id="itemHsn" placeholder="Auto" readonly>
      </div>
    </div>

    <!-- ROW 5: Rate, Disc, GST Added (Right of Disc), Qty, Total -->
    <div class="grid-row row-item-btm">
      <div class="form-col">
        <label>RATE (₹) [🔒 LOCKED]</label>
        <input type="text" id="itemRate" value="Locked" readonly>
      </div>
      <div class="form-col">
        <label>DISC (₹/PC)</label>
        <input type="number" id="itemDisc" value="0" min="0" oninput="calculateItemTotal()">
      </div>
      <div class="form-col">
        <label>GST (₹) [ADDED]</label>
        <input type="text" id="itemGstAdded" value="0.00" readonly style="color:#b45309; font-weight:800;">
      </div>
      <div class="form-col">
        <label>QTY</label>
        <input type="number" id="itemQty" value="1" min="1" oninput="calculateItemTotal()">
      </div>
      <div class="form-col">
        <label>TOTAL (₹)</label>
        <input type="text" id="itemTotal" value="0.00" readonly>
      </div>
    </div>

    <!-- Add Item Button -->
    <button class="btn-add" onclick="addItemToBill()">+ Add Item / Charge to Bill</button>

    <!-- Table with GST Column right of Disc -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Item & Description</th>
            <th>HSN/SAC</th>
            <th>Rate</th>
            <th>Disc</th>
            <th>GST (Added)</th>
            <th>Qty</th>
            <th>Total</th>
            <th style="width: 30px; text-align: center;">✕</th>
          </tr>
        </thead>
        <tbody id="billItemsTbody"></tbody>
      </table>
    </div>

    <!-- Grand Total Bar -->
    <div class="total-bar">
      <div class="total-title">Grand Total:</div>
      <div class="total-amt" id="lblGrandTotal">₹0.00</div>
    </div>

    <!-- Save & Print Button -->
    <button class="btn-save" id="btnSubmitBill" onclick="validateAndSaveBill()">
      ⚡ Save Bill & Generate PDF
    </button>
  </div>

  <script>
    // ⚙️️ LIVE GOOGLE APPS SCRIPT URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHcrqIvOrJicUMpbFpfh1sDxPHTecb-_gp04eVbFKSwb7BCMy5Sts3UoUE4zw_rFpFuA/exec";

    let currentUser = JSON.parse(localStorage.getItem("mle_user")) || null;
    let cachedItems = JSON.parse(localStorage.getItem("mle_items")) || [];
    let billItems = [];
    let currentItemObj = null;

    window.onload = function() {
      // Set Today's Date automatically
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById("billDate").value = `${yyyy}-${mm}-${dd}`;

      if (!currentUser) {
        document.getElementById("authOverlay").style.display = "flex";
      } else {
        initSession();
      }
    };

    function initSession() {
      document.getElementById("lblUser").innerText = `${currentUser.name} (${currentUser.role})`;
      populateDatalist(cachedItems);
      refreshAppData();
    }

    // CORS Safe Request
    async function apiCall(action, payload = {}) {
      payload.action = action;
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const txt = await res.text();
      return JSON.parse(txt);
    }

    // ⚡ Phone Refresh Sync
    async function refreshAppData() {
      const btn = document.getElementById("btnRefresh");
      btn.innerText = "⏳ Syncing...";
      btn.disabled = true;

      try {
        const res = await apiCall("getAppData", { role: currentUser ? currentUser.role : "Staff" });
        if (res && res.items) {
          cachedItems = res.items;
          localStorage.setItem("mle_items", JSON.stringify(res.items));
          populateDatalist(res.items);

          if (res.alerts && res.alerts.length > 0) {
            document.getElementById("lowStockItemsList").innerHTML = res.alerts.map(a => `• ${a}`).join("<br>");
            document.getElementById("lowStockAlertBox").style.display = "block";
          } else {
            document.getElementById("lowStockAlertBox").style.display = "none";
          }
          btn.innerText = "✓ Synced";
        }
      } catch(e) {
        btn.innerText = "🔄 Refresh";
      }
      setTimeout(() => {
        btn.innerText = "🔄 Refresh";
        btn.disabled = false;
      }, 1500);
    }

    function populateDatalist(items) {
      const dl = document.getElementById("dlItems");
      dl.innerHTML = "";
      items.forEach(it => {
        const opt = document.createElement("option");
        opt.value = it.name;
        dl.appendChild(opt);
      });
    }

    // ⚡ OTP Login Handlers
    async function sendOtp() {
      const phone = document.getElementById("loginPhone").value.trim().replace(/\D/g, '');
      const err = document.getElementById("loginErr");
      const btn = document.getElementById("btnSendOtp");

      if (phone.length !== 10) {
        err.innerText = "10-digit number enter karein!";
        err.style.display = "block";
        return;
      }
      err.style.display = "none";
      btn.disabled = true;
      btn.innerText = "Generating OTP...";

      try {
        const res = await apiCall("requestLoginOtp", { phone: phone });
        btn.disabled = false;
        btn.innerText = "📲 SEND OTP ON WHATSAPP";
        if (res && res.success) {
          document.getElementById("stepPhone").style.display = "none";
          document.getElementById("stepOtp").style.display = "block";
          document.getElementById("displaySentPhone").innerText = `${res.phone} (${res.name})`;
          document.getElementById("waDirectBtn").href = res.waUrl;
          window.open(res.waUrl, '_blank');
        } else {
          err.innerText = res.message || "Unauthorized Mobile Number!";
          err.style.display = "block";
        }
      } catch(e) {
        btn.disabled = false;
        btn.innerText = "📲 SEND OTP ON WHATSAPP";
        err.innerText = "Connection failed. Please retry!";
        err.style.display = "block";
      }
    }

    async function verifyOtp() {
      const phone = document.getElementById("loginPhone").value.trim().replace(/\D/g, '');
      const otp = document.getElementById("loginOtp").value.trim();
      const res = await apiCall("verifyLoginOtp", { phone: phone, otp: otp });
      if (res && res.success) {
        currentUser = res;
        localStorage.setItem("mle_user", JSON.stringify(res));
        document.getElementById("authOverlay").style.display = "none";
        initSession();
      } else {
        alert(res.message || "Invalid OTP!");
      }
    }

    // ⚡ Item Selection
    function onItemSelect() {
      const name = document.getElementById("itemSearch").value.trim();
      const match = cachedItems.find(x => x.name.toLowerCase() === name.toLowerCase());

      if (match) {
        currentItemObj = match;
        document.getElementById("itemHsn").value = match.hsn || "-";
        resolveRate();
      } else if (name.toLowerCase().includes("labour") || name.toLowerCase().includes("service")) {
        currentItemObj = { name: name, hsn: "998519", custRate: 0, elecRate: 0, famRate: 0, gstPct: 18 };
        document.getElementById("itemHsn").value = "998519";
        document.getElementById("itemRate").value = "0";
        document.getElementById("itemRate").readOnly = false;
      } else {
        currentItemObj = null;
        document.getElementById("itemHsn").value = "Auto";
        document.getElementById("itemRate").value = "Locked";
        document.getElementById("itemRate").readOnly = true;
      }
      calculateItemTotal();
    }

    function onRateTypeChange() {
      resolveRate();
      calculateItemTotal();
    }

    function resolveRate() {
      if (!currentItemObj) return;
      const rateType = document.getElementById("rateType").value;
      let r = currentItemObj.custRate || 0;
      if (rateType === "Electrician Rate") r = currentItemObj.elecRate || r;
      if (rateType === "Wholesale Rate" && currentItemObj.famRate) r = currentItemObj.famRate;

      document.getElementById("itemRate").value = `₹${r}`;
    }

    // ⚡ GST ADDITION AFTER DISCOUNT LOGIC
    function calculateItemTotal() {
      let baseRate = 0;
      const rateVal = document.getElementById("itemRate").value;
      if (rateVal.includes("₹")) {
        baseRate = parseFloat(rateVal.replace("₹", "")) || 0;
      } else {
        baseRate = parseFloat(rateVal) || 0;
      }

      const disc = parseFloat(document.getElementById("itemDisc").value) || 0;
      const qty = parseFloat(document.getElementById("itemQty").value) || 1;
      const discountedRate = Math.max(0, baseRate - disc);

      const isGstSelected = document.getElementById("isGstBill").value.includes("Yes");
      let gstPerPc = 0;

      if (isGstSelected) {
        const gstPct = (currentItemObj && currentItemObj.gstPct) ? currentItemObj.gstPct : 18;
        gstPerPc = (discountedRate * gstPct) / 100;
      }

      document.getElementById("itemGstAdded").value = `+₹${gstPerPc.toFixed(2)}`;
      const finalUnitRate = discountedRate + gstPerPc;
      const total = finalUnitRate * qty;

      document.getElementById("itemTotal").value = total.toFixed(2);
    }

    // ⚡ Add Item to Table
    function addItemToBill() {
      const name = document.getElementById("itemSearch").value.trim();
      const hsn = document.getElementById("itemHsn").value.trim();
      const serial = document.getElementById("itemSerial").value.trim();

      let baseRate = 0;
      const rateVal = document.getElementById("itemRate").value;
      if (rateVal.includes("₹")) {
        baseRate = parseFloat(rateVal.replace("₹", "")) || 0;
      } else {
        baseRate = parseFloat(rateVal) || 0;
      }

      const disc = parseFloat(document.getElementById("itemDisc").value) || 0;
      const qty = parseFloat(document.getElementById("itemQty").value) || 1;
      const discountedRate = Math.max(0, baseRate - disc);

      const isGstSelected = document.getElementById("isGstBill").value.includes("Yes");
      let gstPerPc = 0;
      const gstPct = (currentItemObj && currentItemObj.gstPct) ? currentItemObj.gstPct : 18;

      if (isGstSelected) {
        gstPerPc = (discountedRate * gstPct) / 100;
      }

      const finalUnitRate = discountedRate + gstPerPc;
      const total = finalUnitRate * qty;

      if (!name) { alert("⚠️ Kripya Item select karein!"); return; }
      if (baseRate <= 0) { alert("⚠️ Rate 0 se zyada hona chahiye!"); return; }

      billItems.push({
        name: name,
        serialNo: serial,
        hsn: hsn,
        baseRate: baseRate,
        discount: disc,
        gstPct: isGstSelected ? gstPct : 0,
        gstPerPc: gstPerPc,
        finalRate: finalUnitRate,
        qty: qty,
        total: total
      });

      renderBillTable();

      // Reset item inputs
      document.getElementById("itemSearch").value = "";
      document.getElementById("itemSerial").value = "";
      document.getElementById("itemHsn").value = "Auto";
      document.getElementById("itemRate").value = "Locked";
      document.getElementById("itemRate").readOnly = true;
      document.getElementById("itemDisc").value = "0";
      document.getElementById("itemGstAdded").value = "0.00";
      document.getElementById("itemQty").value = "1";
      document.getElementById("itemTotal").value = "0.00";
      currentItemObj = null;
    }

    function renderBillTable() {
      const tbody = document.getElementById("billItemsTbody");
      tbody.innerHTML = "";
      let grand = 0;

      billItems.forEach((it, idx) => {
        grand += it.total;
        tbody.innerHTML += `
          <tr>
            <td>
              <b>${it.name}</b>
              ${it.serialNo ? `<br><small style="color:#d97706;">${it.serialNo}</small>` : ''}
            </td>
            <td>${it.hsn || '-'}</td>
            <td>₹${it.baseRate.toFixed(2)}</td>
            <td style="color:#059669;">-₹${it.discount.toFixed(2)}</td>
            <td style="color:#b45309; font-weight:bold;">+₹${it.gstPerPc.toFixed(2)}</td>
            <td>${it.qty}</td>
            <td>₹${it.total.toFixed(2)}</td>
            <td style="text-align:center;"><button class="btn-del-row" onclick="deleteBillItem(${idx})">✕</button></td>
          </tr>
        `;
      });

      document.getElementById("lblGrandTotal").innerText = `₹${grand.toFixed(2)}`;
    }

    function deleteBillItem(idx) {
      billItems.splice(idx, 1);
      renderBillTable();
    }

    // ⚡ STRICT FORCE-BLANK VALIDATIONS
    async function validateAndSaveBill() {
      const billDateRaw = document.getElementById("billDate").value;
      const mode = document.getElementById("billMode").value;
      const rateType = document.getElementById("rateType").value;
      const isGst = document.getElementById("isGstBill").value;
      const payMode = document.getElementById("paymentMode").value;
      const custName = document.getElementById("custName").value.trim();

      // 1. Mandatory Bill Date
      if (!billDateRaw) {
        alert("⚠️ Galti: Kripya Bill Date select karein!");
        document.getElementById("billDate").focus();
        return;
      }

      // 2. Mandatory Mode
      if (!mode) {
        alert("⚠️ Galti: Kripya Mode (Final Bill / Estimate) select karein!");
        document.getElementById("billMode").focus();
        return;
      }

      // 3. Mandatory Rate Type
      if (!rateType) {
        alert("⚠️ Galti: Kripya Rate Type select karein!");
        document.getElementById("rateType").focus();
        return;
      }

      // 4. Mandatory GST Bill?
      if (!isGst) {
        alert("⚠️ Galti: Kripya GST Bill? (Yes/No) select karein!");
        document.getElementById("isGstBill").focus();
        return;
      }

      // 5. Mandatory Payment Mode
      if (!payMode) {
        alert("⚠️ Galti: Kripya Payment Mode (Cash / UPI / Udhar) select karein!");
        document.getElementById("paymentMode").focus();
        return;
      }

      // 6. Mandatory Customer Name
      if (!custName) {
        alert("⚠ Galti: Kripya Customer ka Naam enter karein!");
        document.getElementById("custName").focus();
        return;
      }

      // 7. Mandatory Items
      if (billItems.length === 0) {
        alert("⚠️ Galti: Bill me kam se kam 1 item zaroor add karein!");
        return;
      }

      const btn = document.getElementById("btnSubmitBill");
      btn.disabled = true;
      btn.innerText = "⏳ Saving Bill & Generating PDF...";

      // Format clean date DD-MMM-YYYY
      const parts = billDateRaw.split("-");
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const formattedDate = `${parts[2]}-${months[parseInt(parts[1])-1]}-${parts[0]}`;

      const payload = {
        billMode: mode.includes("Estimate") ? "Estimate" : "Invoice",
        billDate: formattedDate,
        rateType: rateType,
        isGst: isGst.includes("Yes"),
        paymentMode: payMode,
        customerName: custName,
        phone: document.getElementById("custPhone").value.trim(),
        address: document.getElementById("custAddress").value.trim(),
        gstin: document.getElementById("custGstin").value.trim(),
        items: billItems,
        grandTotal: billItems.reduce((acc, c) => acc + c.total, 0)
      };

      try {
        const res = await apiCall("processBillOrEstimate", payload);
        btn.disabled = false;
        btn.innerText = "⚡ Save Bill & Generate PDF";

        if (res && res.success) {
          alert(`✓ Bill Generated Successfully! Doc No: ${res.docNo}`);
          if (res.pdfUrl) window.open(res.pdfUrl, '_blank');

          // Reset cart & forced-blank fields
          billItems = [];
          renderBillTable();
          document.getElementById("custName").value = "";
          document.getElementById("custPhone").value = "";
          document.getElementById("custGstin").value = "";
          document.getElementById("billMode").selectedIndex = 0;
          document.getElementById("rateType").selectedIndex = 0;
          document.getElementById("isGstBill").selectedIndex = 0;
          document.getElementById("paymentMode").selectedIndex = 0;
        } else {
          alert("Error: " + (res.message || "Failed to save bill"));
        }
      } catch(e) {
        btn.disabled = false;
        btn.innerText = "⚡ Save Bill & Generate PDF";
        alert("Server communication error. Please retry!");
      }
    }
  </script>
</body>
