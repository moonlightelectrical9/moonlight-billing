<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moon Light Electricals - ERP & Billing</title>
  <style>
    :root {
      --bg: #070d17;
      --card: #0f172a;
      --card-border: #1e293b;
      --accent: #f59e0b;
      --text: #ffffff;
      --sub: #94a3b8;
      --primary: #2563eb;
      --green: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; min-height: 100vh; }

    /* Top Navbar */
    .navbar {
      background: #09111e;
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; }
    .brand span { color: var(--accent); }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .btn-refresh {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-refresh:active { transform: scale(0.96); background: #334155; }
    .user-pill {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--sub);
    }

    .container { max-width: 1150px; margin: 20px auto; padding: 0 16px; }

    /* Main Box Cards */
    .card-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    /* Grid Layouts */
    .grid-row {
      display: grid;
      gap: 14px;
      margin-bottom: 14px;
    }
    .row-cust-top { grid-template-columns: 1fr 1.5fr 1.2fr 1.2fr; }
    .row-cust-btm { grid-template-columns: 1.2fr 1.2fr 1.2fr 2fr; }
    .row-item-top { grid-template-columns: 3fr 1.2fr 1fr 1fr 1fr; }

    @media (max-width: 900px) {
      .row-cust-top { grid-template-columns: 1fr 1fr; }
      .row-cust-btm { grid-template-columns: 1fr 1fr; }
      .row-item-top { grid-template-columns: 1fr 1fr; }
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 11px;
      font-weight: 800;
      color: var(--sub);
      text-transform: uppercase;
    }
    .form-group label span { color: var(--danger); }

    /* Dark Input Elements */
    input, select {
      background: #070d17;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: #475569; }
    select option { background: #0f172a; color: #ffffff; }
    input[readonly] { background: #0b1320; color: #94a3b8; }

    /* Action Buttons */
    .btn-add-item {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      margin-top: 14px;
      transition: 0.2s;
    }
    .btn-add-item:active { transform: scale(0.98); }

    /* Table */
    .table-container {
      width: 100%;
      margin-top: 18px;
      border-top: 1px solid var(--card-border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      color: var(--sub);
      padding: 12px 10px;
      text-align: left;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 1px solid var(--card-border);
    }
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #142033;
    }
    .btn-del {
      color: var(--danger);
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Summary Bar */
    .summary-box {
      margin-top: 18px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--card-border);
    }
    .grand-total-val {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent);
    }

    /* Green Save Button */
    .btn-save-bill {
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 900;
      width: 100%;
      cursor: pointer;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-save-bill:active { transform: scale(0.99); }
    .btn-save-bill:disabled { background: #334155; cursor: not-allowed; }

    /* Login Modal */
    #authModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .auth-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 26px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 🔒 LOGIN OVERLAY -->
  <div id="authModal" style="display: none;">
    <div class="auth-box">
      <div class="brand" style="font-size: 20px;">MOON<span>LIGHT</span> ELECTRICALS</div>
      <div style="font-size: 11px; color: var(--accent); font-style: italic; margin-top: 2px; margin-bottom: 20px;">Brightening Lives, Powering Trust</div>

      <div id="stepPhone">
        <label style="display:block; text-align:left; font-size:11px; font-weight:800; color:var(--sub); margin-bottom:6px;">AUTHORIZED MOBILE NUMBER</label>
        <input type="tel" id="loginPhone" placeholder="Enter 10-digit number" style="width: 100%; margin-bottom: 12px; font-size: 16px;">
        <div id="loginErr" style="color: var(--danger); font-size: 12px; margin-bottom: 10px; display: none;"></div>
        <button class="btn-save-bill" id="btnSendOtp" onclick="sendOtp()" style="background:var(--accent); color:#000;">📲 SEND OTP ON WHATSAPP</button>
      </div>

      <div id="stepOtp" style="display: none;">
        <div style="font-size: 12px; color: var(--sub); margin-bottom: 10px;">OTP sent for: <b id="displaySentPhone" style="color:#fff;"></b></div>
        <input type="number" id="loginOtp" placeholder="Enter 4-digit OTP" style="width: 100%; margin-bottom: 12px; font-size: 20px; text-align: center; letter-spacing: 4px;">
        <button class="btn-save-bill" onclick="verifyOtp()">VERIFY & LOGIN</button>
        <div style="margin-top: 12px;">
          <a id="waDirectBtn" href="#" target="_blank" style="font-size: 11px; color: var(--accent); text-decoration: underline;">Direct open WhatsApp for OTP</a>
        </div>
      </div>
    </div>
  </div>

  <!-- 🏠 TOP NAVBAR -->
  <div class="navbar">
    <div class="brand">MOON<span>LIGHT</span> ELECTRICALS</div>
    <div class="nav-actions">
      <button class="btn-refresh" id="btnRefresh" onclick="refreshAppData()" title="Sync Items From Google Sheet">
        🔄 Refresh
      </button>
      <div class="user-pill" id="lblUser">Session...</div>
    </div>
  </div>

  <div class="container">
    <!-- 1. CUSTOMER & BILL INFORMATION -->
    <div class="card-box">
      <div class="card-title">1. CUSTOMER & BILL INFORMATION</div>
      
      <!-- Row 1 -->
      <div class="grid-row row-cust-top">
        <div class="form-group">
          <label>BILL DATE <span>*</span></label>
          <input type="date" id="billDate">
        </div>
        <div class="form-group">
          <label>CUSTOMER NAME <span>*</span></label>
          <input type="text" id="custName" placeholder="Enter Customer Name">
        </div>
        <div class="form-group">
          <label>MOBILE NUMBER</label>
          <input type="tel" id="custPhone" placeholder="10-digit number">
        </div>
        <div class="form-group">
          <label>RATE TYPE <span>*</span></label>
          <select id="rateType" onchange="onRateTypeChange()">
            <option value="" disabled selected>-- Select Rate Type --</option>
            <option value="Customer Rate">Customer Rate</option>
            <option value="Electrician Rate">Electrician Rate</option>
            <option value="Wholesale Rate">Wholesale Rate</option>
          </select>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="grid-row row-cust-btm">
        <div class="form-group">
          <label>PAYMENT MODE <span>*</span></label>
          <select id="paymentMode">
            <option value="" disabled selected>-- Select Payment Mode --</option>
            <option value="Cash">Cash</option>
            <option value="UPI / Online">UPI / Online</option>
            <option value="Credit / Udhar">Credit / Udhar</option>
          </select>
        </div>
        <div class="form-group">
          <label>GST BILL? <span>*</span></label>
          <select id="isGstBill" onchange="calculateItemTotal()">
            <option value="" disabled selected>-- Select GST Bill --</option>
            <option value="Yes">Yes (GST Invoice)</option>
            <option value="No">No (Regular Bill)</option>
          </select>
        </div>
        <div class="form-group">
          <label>DOCUMENT TYPE</label>
          <select id="docType">
            <option value="Invoice">Retail Invoice</option>
            <option value="Estimate">Quotation / Estimate</option>
          </select>
        </div>
        <div class="form-group">
          <label>ADDRESS</label>
          <input type="text" id="custAddress" value="Sector-121, Noida">
        </div>
      </div>
    </div>

    <!-- 2. ADD ITEMS -->
    <div class="card-box">
      <div class="card-title">2. ADD ITEMS</div>
      
      <!-- Top Fields -->
      <div class="grid-row row-item-top">
        <div class="form-group" style="grid-column: span 1;">
          <label>SEARCH & SELECT ITEM</label>
          <input list="dlItems" id="itemSearch" placeholder="Type item name..." onchange="onItemSelect()">
          <datalist id="dlItems"></datalist>
        </div>
        <div class="form-group">
          <label>RATE (₹)</label>
          <input type="text" id="itemRate" value="0.00" readonly>
        </div>
        <div class="form-group">
          <label>DISCOUNT (₹/PC)</label>
          <input type="number" id="itemDisc" value="0" min="0" oninput="calculateItemTotal()">
        </div>
        <div class="form-group">
          <label>GST (₹) [ADDED]</label>
          <input type="text" id="itemGstAdded" value="0.00" readonly style="color:var(--accent); font-weight:800;">
        </div>
        <div class="form-group">
          <label>QUANTITY</label>
          <input type="number" id="itemQty" value="1" min="1" oninput="calculateItemTotal()">
        </div>
      </div>

      <!-- Serial Note -->
      <div class="grid-row" style="grid-template-columns: 1fr;">
        <div class="form-group">
          <label>SERIAL NUMBER / WARRANTY NOTE</label>
          <input type="text" id="itemSerial" placeholder="Optional note or serial number">
        </div>
      </div>

      <button class="btn-add-item" onclick="addItemToBill()">+ Add Item To Bill</button>

      <!-- Bill Items Table -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 30px;">#</th>
              <th>DESCRIPTION</th>
              <th>RATE</th>
              <th>DISC</th>
              <th>GST</th>
              <th>QTY</th>
              <th>TOTAL</th>
              <th style="width: 30px; text-align: center;">✕</th>
            </tr>
          </thead>
          <tbody id="billItemsTbody"></tbody>
        </table>
      </div>

      <!-- Totals Bar -->
      <div class="summary-box">
        <div>
          <div style="font-size: 11px; color: var(--sub); text-transform: uppercase; font-weight: 800;">TOTAL ITEMS</div>
          <div id="lblTotalItems" style="font-size: 18px; font-weight: 900; margin-top: 2px;">0</div>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 11px; color: var(--sub); text-transform: uppercase; font-weight: 800;">GRAND TOTAL</div>
          <div class="grand-total-val" id="lblGrandTotal">₹0.00</div>
        </div>
      </div>

      <button class="btn-save-bill" id="btnSubmitBill" onclick="validateAndSaveBill()">
        ⚡ GENERATE & PRINT INVOICE
      </button>
    </div>
  </div>

  <script>
    // ⚙️ LIVE GOOGLE APPS SCRIPT URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHcrqIvOrJicUMpbFpfh1sDxPHTecb-_gp04eVbFKSwb7BCMy5Sts3UoUE4zw_rFpFuA/exec";

    let currentUser = JSON.parse(localStorage.getItem("mle_user")) || null;
    let cachedItems = JSON.parse(localStorage.getItem("mle_items")) || [];
    let billItems = [];
    let currentItemObj = null;

    window.onload = function() {
      // Set Today's Date automatically (YYYY-MM-DD)
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById("billDate").value = `${yyyy}-${mm}-${dd}`;

      if (!currentUser) {
        document.getElementById("authModal").style.display = "flex";
      } else {
        initSession();
      }
    };

    function initSession() {
      document.getElementById("lblUser").innerText = `${currentUser.name} (${currentUser.role})`;
      populateDatalist(cachedItems);
      refreshAppData();
    }

    // CORS Safe API Trigger
    async function apiCall(action, payload = {}) {
      payload.action = action;
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const txt = await res.text();
      return JSON.parse(txt);
    }

    // ⚡ Phone-Friendly Refresh Button
    async function refreshAppData() {
      const btn = document.getElementById("btnRefresh");
      btn.innerText = "⏳ Syncing...";
      btn.disabled = true;

      try {
        const res = await apiCall("getAppData", { role: currentUser ? currentUser.role : "Staff" });
        if (res && res.items) {
          cachedItems = res.items;
          localStorage.setItem("mle_items", JSON.stringify(res.items));
          populateDatalist(res.items);
          btn.innerText = "✓ Synced";
        }
      } catch(e) {
        btn.innerText = "🔄 Refresh";
      }
      setTimeout(() => {
        btn.innerText = "🔄 Refresh";
        btn.disabled = false;
      }, 1500);
    }

    function populateDatalist(items) {
      const dl = document.getElementById("dlItems");
      dl.innerHTML = "";
      items.forEach(it => {
        const opt = document.createElement("option");
        opt.value = it.name;
        dl.appendChild(opt);
      });
    }

    // ⚡ Login & OTP Handlers
    async function sendOtp() {
      const phone = document.getElementById("loginPhone").value.trim().replace(/\D/g, '');
      const err = document.getElementById("loginErr");
      const btn = document.getElementById("btnSendOtp");

      if (phone.length !== 10) {
        err.innerText = "10-digit number enter karein!";
        err.style.display = "block";
        return;
      }
      err.style.display = "none";
      btn.disabled = true;
      btn.innerText = "Generating OTP...";

      try {
        const res = await apiCall("requestLoginOtp", { phone: phone });
        btn.disabled = false;
        btn.innerText = "📲 SEND OTP ON WHATSAPP";
        if (res && res.success) {
          document.getElementById("stepPhone").style.display = "none";
          document.getElementById("stepOtp").style.display = "block";
          document.getElementById("displaySentPhone").innerText = `${res.phone} (${res.name})`;
          document.getElementById("waDirectBtn").href = res.waUrl;
          window.open(res.waUrl, '_blank');
        } else {
          err.innerText = res.message || "Unauthorized Mobile Number!";
          err.style.display = "block";
        }
      } catch(e) {
        btn.disabled = false;
        btn.innerText = "📲 SEND OTP ON WHATSAPP";
        err.innerText = "Connection failed. Please retry!";
        err.style.display = "block";
      }
    }

    async function verifyOtp() {
      const phone = document.getElementById("loginPhone").value.trim().replace(/\D/g, '');
      const otp = document.getElementById("loginOtp").value.trim();
      const res = await apiCall("verifyLoginOtp", { phone: phone, otp: otp });
      if (res && res.success) {
        currentUser = res;
        localStorage.setItem("mle_user", JSON.stringify(res));
        document.getElementById("authModal").style.display = "none";
        initSession();
      } else {
        alert(res.message || "Invalid OTP!");
      }
    }

    // ⚡ Item Selection & Rate Resolution
    function onItemSelect() {
      const name = document.getElementById("itemSearch").value.trim();
      const match = cachedItems.find(x => x.name.toLowerCase() === name.toLowerCase());

      if (match) {
        currentItemObj = match;
        resolveRate();
      } else if (name.toLowerCase().includes("labour") || name.toLowerCase().includes("service")) {
        currentItemObj = { name: name, hsn: "998519", custRate: 0, elecRate: 0, famRate: 0, gstPct: 18 };
        document.getElementById("itemRate").value = "0.00";
        document.getElementById("itemRate").readOnly = false;
      } else {
        currentItemObj = null;
        document.getElementById("itemRate").value = "0.00";
        document.getElementById("itemRate").readOnly = true;
      }
      calculateItemTotal();
    }

    function onRateTypeChange() {
      resolveRate();
      calculateItemTotal();
    }

    function resolveRate() {
      if (!currentItemObj) return;
      const rateType = document.getElementById("rateType").value;
      let r = currentItemObj.custRate || 0;
      if (rateType === "Electrician Rate") r = currentItemObj.elecRate || r;
      if (rateType === "Wholesale Rate" && currentItemObj.famRate) r = currentItemObj.famRate;

      document.getElementById("itemRate").value = parseFloat(r).toFixed(2);
    }

    // ⚡ GST ADDITION AFTER DISCOUNT
    function calculateItemTotal() {
      const baseRate = parseFloat(document.getElementById("itemRate").value) || 0;
      const disc = parseFloat(document.getElementById("itemDisc").value) || 0;
      const qty = parseFloat(document.getElementById("itemQty").value) || 1;
      const discountedRate = Math.max(0, baseRate - disc);

      const isGst = document.getElementById("isGstBill").value === "Yes";
      let gstPerPc = 0;

      if (isGst) {
        const gstPct = (currentItemObj && currentItemObj.gstPct) ? currentItemObj.gstPct : 18;
        gstPerPc = (discountedRate * gstPct) / 100;
      }

      document.getElementById("itemGstAdded").value = `+₹${gstPerPc.toFixed(2)}`;
      const finalUnitRate = discountedRate + gstPerPc;
      const total = finalUnitRate * qty;
      return { finalUnitRate, total, gstPerPc, discountedRate };
    }

    // ⚡ Add Item to Table
    function addItemToBill() {
      const name = document.getElementById("itemSearch").value.trim();
      const serial = document.getElementById("itemSerial").value.trim();
      const baseRate = parseFloat(document.getElementById("itemRate").value) || 0;
      const disc = parseFloat(document.getElementById("itemDisc").value) || 0;
      const qty = parseFloat(document.getElementById("itemQty").value) || 1;

      if (!name) { alert("⚠️ Kripya Item select karein!"); return; }
      if (baseRate <= 0) { alert("⚠️ Rate 0 se zyada hona chahiye!"); return; }

      const calc = calculateItemTotal();
      const isGst = document.getElementById("isGstBill").value === "Yes";
      const gstPct = (currentItemObj && currentItemObj.gstPct) ? currentItemObj.gstPct : 18;

      billItems.push({
        name: name,
        serialNo: serial,
        hsn: (currentItemObj && currentItemObj.hsn) ? currentItemObj.hsn : "-",
        baseRate: baseRate,
        discount: disc,
        gstPct: isGst ? gstPct : 0,
        gstPerPc: calc.gstPerPc,
        finalRate: calc.finalUnitRate,
        qty: qty,
        total: calc.total
      });

      renderBillTable();

      // Reset item inputs
      document.getElementById("itemSearch").value = "";
      document.getElementById("itemSerial").value = "";
      document.getElementById("itemRate").value = "0.00";
      document.getElementById("itemRate").readOnly = true;
      document.getElementById("itemDisc").value = "0";
      document.getElementById("itemGstAdded").value = "0.00";
      document.getElementById("itemQty").value = "1";
      currentItemObj = null;
    }

    function renderBillTable() {
      const tbody = document.getElementById("billItemsTbody");
      tbody.innerHTML = "";
      let grand = 0;

      billItems.forEach((it, idx) => {
        grand += it.total;
        tbody.innerHTML += `
          <tr>
            <td>${idx + 1}</td>
            <td>
              <b>${it.name}</b>
              ${it.serialNo ? `<br><small style="color:var(--accent); font-weight:700;">Note: ${it.serialNo}</small>` : ''}
            </td>
            <td>₹${it.baseRate.toFixed(2)}</td>
            <td style="color:#10b981;">-₹${it.discount.toFixed(2)}</td>
            <td style="color:var(--accent); font-weight:bold;">+₹${it.gstPerPc.toFixed(2)}</td>
            <td>${it.qty}</td>
            <td>₹${it.total.toFixed(2)}</td>
            <td style="text-align:center;"><button class="btn-del" onclick="deleteBillItem(${idx})">✕</button></td>
          </tr>
        `;
      });

      document.getElementById("lblTotalItems").innerText = billItems.length;
      document.getElementById("lblGrandTotal").innerText = `₹${grand.toFixed(2)}`;
    }

    function deleteBillItem(idx) {
      billItems.splice(idx, 1);
      renderBillTable();
    }

    // ⚡ STRICT FORCE-BLANK VALIDATIONS (No Field Skipped)
    async function validateAndSaveBill() {
      const billDateRaw = document.getElementById("billDate").value;
      const custName = document.getElementById("custName").value.trim();
      const rateType = document.getElementById("rateType").value;
      const payMode = document.getElementById("paymentMode").value;
      const isGst = document.getElementById("isGstBill").value;

      // 1. Mandatory Bill Date
      if (!billDateRaw) {
        alert("⚠️ Galti: Kripya Bill Date select karein!");
        document.getElementById("billDate").focus();
        return;
      }

      // 2. Mandatory Customer Name
      if (!custName) {
        alert("⚠️ Galti: Kripya Customer ka Naam enter karein!");
        document.getElementById("custName").focus();
        return;
      }

      // 3. Mandatory Rate Type
      if (!rateType) {
        alert("⚠️ Galti: Kripya Rate Type select karein!");
        document.getElementById("rateType").focus();
        return;
      }

      // 4. Mandatory Payment Mode
      if (!payMode) {
        alert("⚠️ Galti: Kripya Payment Mode (Cash / UPI / Udhar) select karein!");
        document.getElementById("paymentMode").focus();
        return;
      }

      // 5. Mandatory GST Bill?
      if (!isGst) {
        alert("⚠️ Galti: Kripya GST Bill? (Yes / No) select karein!");
        document.getElementById("isGstBill").focus();
        return;
      }

      // 6. Mandatory Items
      if (billItems.length === 0) {
        alert("⚠️ Galti: Bill me kam se kam 1 item zaroor add karein!");
        return;
      }

      const btn = document.getElementById("btnSubmitBill");
      btn.disabled = true;
      btn.innerText = "⏳ Generating Invoice & PDF...";

      // Format Date DD-MMM-YYYY
      const parts = billDateRaw.split("-");
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const formattedDate = `${parts[2]}-${months[parseInt(parts[1])-1]}-${parts[0]}`;

      const payload = {
        billMode: document.getElementById("docType").value,
        billDate: formattedDate,
        rateType: rateType,
        isGst: (isGst === "Yes"),
        paymentMode: payMode,
        customerName: custName,
        phone: document.getElementById("custPhone").value.trim(),
        address: document.getElementById("custAddress").value.trim(),
        items: billItems,
        grandTotal: billItems.reduce((acc, c) => acc + c.total, 0)
      };

      try {
        const res = await apiCall("processBillOrEstimate", payload);
        btn.disabled = false;
        btn.innerText = "⚡ GENERATE & PRINT INVOICE";

        if (res && res.success) {
          alert(`✓ Invoice Generated Successfully! Doc No: ${res.docNo}`);
          if (res.pdfUrl) window.open(res.pdfUrl, '_blank');

          // Reset cart & forced-blank fields
          billItems = [];
          renderBillTable();
          document.getElementById("custName").value = "";
          document.getElementById("custPhone").value = "";
          document.getElementById("rateType").selectedIndex = 0;
          document.getElementById("paymentMode").selectedIndex = 0;
          document.getElementById("isGstBill").selectedIndex = 0;
        } else {
          alert("Error: " + (res.message || "Failed to generate bill"));
        }
      } catch(e) {
        btn.disabled = false;
        btn.innerText = "⚡ GENERATE & PRINT INVOICE";
        alert("Server communication error. Please retry!");
      }
    }
  </script>
</body>
</html>
